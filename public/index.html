<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Research</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">Evidence-backed due diligence</p>
      <h1>Stock Research</h1>
      <p class="lede">A fast view of material risks, unknowns, company context, and catalysts—not financial advice.</p>
    </div>
  </header>
  <main>
    <section class="search-panel" aria-labelledby="search-heading">
      <h2 id="search-heading" class="visually-hidden">Research a ticker</h2>
      <div id="mock-banner" class="mock-banner" hidden role="status"></div>
      <form id="research-form" class="search-form" novalidate>
        <label for="ticker">Ticker</label>
        <div class="search-controls">
          <input id="ticker" name="ticker" placeholder="Example: ACME" maxlength="15" autocomplete="off" spellcheck="false" required>
          <button id="analyze-button" type="submit">Analyze</button>
        </div>
      </form>
      <p id="status" class="request-status" role="status" aria-live="polite"></p>
    </section>
    <section id="results" class="dashboard" aria-live="polite" aria-busy="false" hidden></section>
  </main>
  <footer><p>Use this report as a research aid. Verify material evidence before making decisions.</p></footer>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
